function cleanOpinion(){const clone=$('opinion').cloneNode(true);clone.querySelectorAll('.inline-revision').forEach(e=>e.remove());clone.querySelectorAll('.selected,.revised-text').forEach(e=>e.classList.remove('selected','revised-text'));return clone.innerHTML}
function syncRevisionState(){const html=cleanOpinion();reviewStates[activeReview]={html,status:$('status').textContent};if(activeReview===0){const root=document.createElement('div');root.innerHTML=html;let index=0,bucket=document.createElement('div');const flush=()=>{if(index)reviewStates[index]={html:bucket.innerHTML,status:$('status').textContent};bucket=document.createElement('div')};Array.from(root.children).forEach(node=>{if(node.matches('.aggregate-title')){flush();index++}else bucket.append(node.cloneNode(true))});flush()}else if(activeReview>=1&&activeReview<=5)reviewStates[0].html=combinedReview()}
function showRevisionNav(){
$('revisionNav').hidden=true;
$('opinion').querySelectorAll('.inline-revision').forEach(el=>el.remove());
const history=revisionHistories.get(revisionKey());if(!history||history.items.length<2)return;
const snapshots=history.items.map(entry=>{const container=document.createElement('div');container.innerHTML=entry.html;return Array.from(container.querySelectorAll('p')).map(p=>p.textContent)});
Array.from($('opinion').querySelectorAll('p')).forEach((paragraph,index)=>{
const variants=[];snapshots.forEach(rows=>{const value=rows[index];if(typeof value==='string'&&variants[variants.length-1]!==value)variants.push(value)});
const explicitlyChanged=history.items.some(entry=>Array.isArray(entry.changedIndices)&&entry.changedIndices.includes(index));if(!explicitlyChanged||variants.length<2)return;
let current=variants.lastIndexOf(paragraph.textContent);if(current<0)return;
const controls=element('div',null,'inline-revision');controls.contentEditable='false';controls.setAttribute('role','group');controls.setAttribute('aria-label','이 문구의 보완 이력');
const previous=element('button','<'),next=element('button','>');previous.type=next.type='button';previous.title='이전 문구';next.title='다음 문구';previous.setAttribute('aria-label','이 문구의 이전 버전');next.setAttribute('aria-label','이 문구의 다음 버전');
function updateButtons(){previous.disabled=current===0||revisionBusy||editing;next.disabled=current===variants.length-1||revisionBusy||editing}
function move(delta){if(revisionBusy||editing)return;const target=current+delta;if(target<0||target>=variants.length)return;current=target;paragraph.textContent=variants[current];paragraph.classList.add('revised-text');if(selectedParagraphs.has(paragraph))updateSelectionLabel();syncRevisionState();updateButtons();positionRevisionControls()}
previous.onclick=()=>move(-1);next.onclick=()=>move(1);controls.append(previous,next);paragraph.before(controls);updateButtons();positionRevisionControls();
});
}
function navigateRevision(delta){if(revisionBusy||editing)return;const h=revisionHistories.get(revisionKey());if(!h)return;const next=h.index+delta;if(next<0||next>=h.items.length)return;clearSelection();h.index=next;$('opinion').innerHTML=h.items[next].html;$('status').textContent=next===0?'이전 문구':h.items[next].demo?'보완 시연':'보완본';syncRevisionState();showRevisionNav()}
$('revisionPrev').onclick=()=>navigateRevision(-1);$('revisionNext').onclick=()=>navigateRevision(1);
function localRevisionPreview(text){return text.replace(/확인이 필요함[.]/g,'확인 필요.').replace(/검토가 필요함[.]/g,'검토 필요.').replace(/검토할 필요가 있음[.]/g,'검토 필요.').replace(/확인할 필요가 있음[.]/g,'확인 필요.').replace(/필요함[.]/g,'필요.');}
const ordinaryChatSubmit=$('form').onsubmit;
$('form').onsubmit=async e=>{if(!reviseMode){ordinaryChatSubmit(e);return}e.preventDefault();if(revisionBusy)return;const request=$('prompt').value.trim();if(!request)return;if(editing){notify('직접 수정을 먼저 완료해 주세요');return}
const paragraphs=Array.from($('opinion').querySelectorAll('p'));const targets=selectedParagraphs.size?selectedInOrder():paragraphs;if(!targets.length){notify('보완할 의견이 없습니다');return}const before=cleanOpinion(),key=revisionKey();const scope=selectedParagraphs.size?'선택 문구 '+selectedParagraphs.size+'개':reviewLabels[activeReview];let h=revisionHistories.get(key);if(!h){h={items:[{html:before,demo:false}],index:0};revisionHistories.set(key,h)}else if(h.items[h.index].html!==before){h.items.push({html:before,demo:false});h.index=h.items.length-1}
const messages=chatThreads.get(currentChatKey())||[];messages.push({role:'user',text:request,scope:'보완요청 · '+scope});chatThreads.set(currentChatKey(),messages);renderChat();
revisionBusy=true;$('appWindow').classList.add('revision-streaming');$('send').disabled=true;$('reviseToggle').disabled=true;showRevisionNav();
const original=targets.map(p=>p.textContent);const changedIndices=[];let changed=false;
try{
// Optional integration point. Returns an array of replacement texts, one per target.
// Without a model adapter the UI demonstrates only concise wording conversion.
const connected=typeof window.creditReviewRevise==='function';const next=connected?await window.creditReviewRevise({request,company:companies[currentCompany].name,item:reviewLabels[activeReview],texts:original,commonPrompt:commonUserPrompt,prompts:noteLists.prompts.map(x=>x.text),notes:noteLists.notes.map(x=>x.text)}):original.map(localRevisionPreview);
if(!Array.isArray(next)||next.length!==original.length||next.some(x=>typeof x!=='string'||!x.trim()))throw new Error('보완 응답 형식이 올바르지 않습니다.');
for(let i=0;i<targets.length;i++){if(next[i]===original[i])continue;changedIndices.push(paragraphs.indexOf(targets[i]));changed=true;const p=targets[i];p.classList.add('revised-text');p.textContent='';for(let n=0;n<next[i].length;n+=7){p.textContent=next[i].slice(0,n+7);await new Promise(resolve=>setTimeout(resolve,18))}}
clearSelection();
if(changed){const after=cleanOpinion();h.items.push({html:after,demo:!connected,changedIndices});h.index=h.items.length-1;$('status').textContent=connected?'보완본':'보완 시연';syncRevisionState();messages.push({role:'assistant',text:connected?'의견을 보완했습니다. 상단 < > 버튼으로 이전 문구와 비교할 수 있습니다.':'AI 미연결 상태로 문구를 간결하게 줄이는 시연을 적용했습니다. 입력한 요청의 의미를 해석한 결과는 아닙니다. < >로 이전 문구를 확인할 수 있습니다.'})}
else messages.push({role:'assistant',text:connected?'변경된 문구가 없습니다.':'AI 미연결 상태입니다. 이번 문구에는 간결화 시연을 적용할 부분이 없어 원문을 유지했습니다.'});$('prompt').value='';
}catch(error){$('opinion').innerHTML=before;clearSelection();messages.push({role:'assistant',text:'보완하지 못해 원문을 유지했습니다. '+error.message})}
finally{revisionBusy=false;$('appWindow').classList.remove('revision-streaming');$('reviseToggle').disabled=false;$('send').disabled=!$('prompt').value.trim();renderChat();showRevisionNav()}
};
const revisionSwitch=switchReview;switchReview=function(index){if(revisionBusy){notify('보완 완료 후 이동할 수 있습니다');return}revisionSwitch(index);showRevisionNav()};

$('grid').querySelectorAll('button').forEach((button,i)=>{const lack=states[i].filter(v=>!v).length;button.classList.remove('unanalysed');button.classList.toggle('bad',lack>0);button.querySelector('strong').textContent=categories[i][0];button.querySelector('small').textContent=(states[i].length-lack)+'/'+states[i].length;let badge=button.querySelector('.badge');if(!badge){badge=element('span',null,'badge');button.append(badge)}badge.textContent=String(lack);badge.hidden=lack===0;button.setAttribute('aria-label',categories[i][0]+(lack?' 미충족 '+lack+'개':' 모두 충족'))})
}
showDetail=function(i){$('grid').hidden=true;$('detail').hidden=false;$('detailTitle').textContent=categories[i][0];$('items').replaceChildren();const states=coverageState()[i];categories[i][1].map((name,j)=>({name,j,ok:states[j]})).sort((a,b)=>Number(a.ok)-Number(b.ok)).forEach(({name,ok})=>{const li=element('li',name);li.append(element('em',ok?'자료 확보 (예시)':'미충족 · 근거 확보 필요',ok?'':'missing'));$('items').append(li)});$('back').focus()};

const operatingFrames=new Map();const operatingExtras=new Map();let liveOperatingCompany=null,operatingTransition=false;
function operationalEntries(entries){return entries.map(e=>({...e,title:e.title||e.text?.split('\n')[0]||'항목',content:e.text??e.content??e.title??''}))}
function operatingPayload(){stashEntries();captureCompany();const items=[1,2,3,4,5].map(i=>{const scope=scopedEntries.get(currentCompany+':'+i)||{notes:[],prompts:[]};const container=document.createElement('div');container.innerHTML=reviewStates[i].html;const extra=operatingExtras.get(currentCompany+':'+i)||{};const messages=chatThreads.get(currentCompany+':'+i)||[];const chat=messages.map(m=>{const row=element('div',null,'message '+m.role);row.append(element(m.role==='user'?'div':'p',m.text,m.role==='user'?'bubble':''));return row.outerHTML}).join('');return {memos:operationalEntries(scope.notes),prompts:operationalEntries(scope.prompts),checks:extra.checks||[],archive:extra.archive||[],texts:Array.from(container.querySelectorAll('p')).map(p=>p.textContent),subtitles:Array.from(container.querySelectorAll('p')).map(p=>{let previous=p.previousElementSibling;while(previous&&previous.classList.contains('inline-revision'))previous=previous.previousElementSibling;return previous?.classList.contains('section-title')?previous.textContent:''}),chat}});return {company:companies[currentCompany].name,caseInfo:companies[currentCompany].caseInfo,active:activeReview,items,files:localFiles.filter(f=>f.kind!=='survey').map(f=>({name:f.name,size:f.file?.size||0,type:f.file?.type||'',file:f.file,bridgeMeta:f,previewUrl:f.file?URL.createObjectURL(f.file):''})),survey:localFiles.find(f=>f.kind==='survey')||null,commonPrompt:commonUserPrompt}}
function exportOperating(){if(liveOperatingCompany===null)return;const frame=operatingFrames.get(liveOperatingCompany);const api=frame?.contentWindow?.operatingAdapter;if(!api)return;const result=api.export();const company=liveOperatingCompany;
result.items.forEach((entry,index)=>{const i=index+1;const toMemo=e=>({...e,text:e.content||e.title||'',date:e.date||''});const prior=scopedEntries.get(company+':'+i)||{noteDraft:{text:'',index:null},promptDraft:{text:'',index:null}};scopedEntries.set(company+':'+i,{...prior,notes:entry.memos.map(toMemo),prompts:entry.considerations.map(toMemo)});operatingExtras.set(company+':'+i,{checks:entry.checks,archive:entry.archive});
if(company===currentCompany){const container=document.createElement('div');container.innerHTML=reviewStates[i].html;let paragraphs=Array.from(container.querySelectorAll('p'));entry.texts.forEach((text,n)=>{if(paragraphs[n])paragraphs[n].textContent=text;else container.append(element('p',text))});paragraphs.slice(entry.texts.length).forEach(p=>p.remove());reviewStates[i]={html:container.innerHTML,status:'작업본'};const chat=document.createElement('div');chat.innerHTML=entry.chat;chatThreads.set(company+':'+i,Array.from(chat.querySelectorAll('.message')).map(row=>({role:row.classList.contains('user')?'user':'assistant',text:row.textContent.trim()})))}
});
if(company===currentCompany){if(result.active>=1&&result.active<=5)activeReview=result.active;localFiles=result.files.map(f=>f.bridgeMeta||{file:f.file||f,name:f.name,description:'',draft:null,priority:'보통',required:false});if(result.survey)localFiles.unshift(result.survey.bridgeMeta||{file:result.survey.file||result.survey,name:result.survey.name,description:'',draft:null,priority:'보통',required:false,kind:'survey'});commonUserPrompt=result.commonPrompt;reviewStates[0].html=combinedReview();restoreEntries();updateFileCount();$('opinion').innerHTML=reviewStates[activeReview].html;$('emptyReview').hidden=Boolean(reviewStates[activeReview].html);showRevisionNav();renderChat();captureCompany()}
}
function ensureOperatingFrame(){let frame=operatingFrames.get(currentCompany);if(!frame){frame=document.createElement('iframe');frame.className='operating-frame';frame.title='운영 기반 전체 작업화면';frame.srcdoc=operatingSource;frame.addEventListener('load',()=>{if(frame.contentWindow.operatingAdapter){if(appWindow.classList.contains('expanded')&&frame===operatingFrames.get(currentCompany)){frame.contentWindow.operatingAdapter.load(operatingPayload());liveOperatingCompany=currentCompany}}else{notify('운영 화면 초기화에 실패했습니다')}});appWindow.append(frame);operatingFrames.set(currentCompany,frame)}return frame}
function enterOperating(){operatingFrames.forEach(f=>f.classList.remove('current'));const frame=ensureOperatingFrame();frame.classList.add('current');appWindow.classList.add('operating-full');if(frame.contentWindow?.operatingAdapter){frame.contentWindow.operatingAdapter.load(operatingPayload());liveOperatingCompany=currentCompany}}
const operationalSyncBase=syncFullWorkspace;
syncFullWorkspace=function(){const on=appWindow.classList.contains('expanded');if(!on&&appWindow.classList.contains('operating-full')){exportOperating();appWindow.classList.remove('operating-full');liveOperatingCompany=null}operationalSyncBase();if(on&&!appWindow.classList.contains('operating-full'))enterOperating()};
const operatingCompanyBase=selectCompany;selectCompany=function(index){const expanded=appWindow.classList.contains('expanded');if(expanded)exportOperating();operatingCompanyBase(index);if(expanded){liveOperatingCompany=null;enterOperating()}};
// Flush work before opening shared material and prompt controls; re-import on close.
['files','notes','prompts','common','companies'].forEach(key=>{const btn=$('rail_'+key),original=btn.onclick;btn.onclick=function(e){if(appWindow.classList.contains('operating-full'))exportOperating();return original.call(this,e)}});
const operatingCloseDrawer=closeDrawer;closeDrawer=function(focus=true){const wasOpen=!$('drawer').hidden;operatingCloseDrawer(focus);if(wasOpen&&appWindow.classList.contains('operating-full')&&!operatingTransition){operatingTransition=true;try{const frame=operatingFrames.get(currentCompany);if(frame?.contentWindow?.operatingAdapter)frame.contentWindow.operatingAdapter.load(operatingPayload())}finally{operatingTransition=false}}};

const reportOutlines = new Map();
let reportOutlineDraft = [];
function renderReportOutlineRows(){
 const box = $('reportOutlineRows'); box.replaceChildren();
 reportOutlineDraft.forEach((title,index)=>{
  const row=element('div',null,'outline-row');
  const input=element('input'); input.value=title; input.maxLength=100; input.setAttribute('aria-label',`목차 ${index+1}`);
  input.oninput=()=>reportOutlineDraft[index]=input.value;
  row.append(input);
  for(const [label,delta] of [['↑',-1],['↓',1]]){
   const button=element('button',label); button.setAttribute('aria-label',delta<0?'위로 이동':'아래로 이동'); button.disabled=index+delta<0||index+delta>=reportOutlineDraft.length;
   button.onclick=()=>{const target=index+delta;[reportOutlineDraft[index],reportOutlineDraft[target]]=[reportOutlineDraft[target],reportOutlineDraft[index]];renderReportOutlineRows()};row.append(button);
  }
  const remove=element('button','×');remove.setAttribute('aria-label','항목 삭제');remove.onclick=()=>{reportOutlineDraft.splice(index,1);renderReportOutlineRows()};row.append(remove);box.append(row);
 });
}
$('reportOutlineOpen').onclick=()=>{
 $('menu').hidden=true;
 reportOutlineDraft=[...(reportOutlines.get(currentCompany)||['업체개요','사업성','수익성','재무안정','상환능력','채권보전','종합 심사의견'])];

window.readReviewStream=async(response,onEvent)=>{
 const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',doneResult;
 try{while(true){const part=await reader.read();buffer+=decoder.decode(part.value||new Uint8Array(),{stream:!part.done});let end;while((end=buffer.indexOf('\n\n'))>=0){const block=buffer.slice(0,end);buffer=buffer.slice(end+2);const lines=block.split('\n'),kind=lines.find(l=>l.startsWith('event:'))?.slice(6).trim(),data=lines.filter(l=>l.startsWith('data:')).map(l=>l.slice(5).trim()).join('\n');if(!data)continue;const value=JSON.parse(data);if(kind==='error')throw Error(value.error||'응답 스트림 오류');onEvent(kind,value);if(kind==='done')doneResult=value;}if(part.done)break;}if(!doneResult)throw Error('응답이 완료되기 전에 연결이 끊겼습니다. 다시 요청해 주세요.');return doneResult;}finally{reader.releaseLock();}
};

/* Plain-text UI: render common LaTeX arrow commands without a math renderer. */
(() => {
 const arrows={rightarrow:'→',longrightarrow:'→',Rightarrow:'⇒',Longrightarrow:'⇒',to:'→',
  leftarrow:'←',longleftarrow:'←',Leftarrow:'⇐',Longleftarrow:'⇐',gets:'←',
  leftrightarrow:'↔',longleftrightarrow:'↔',Leftrightarrow:'⇔',Longleftrightarrow:'⇔',
  uparrow:'↑',downarrow:'↓',mapsto:'↦',longmapsto:'↦'};
 const names=Object.keys(arrows).sort((a,b)=>b.length-a.length).join('|');
 const command='\\\\+('+names+')(?![A-Za-z])';
 const inline=new RegExp('\\${1,2}\\s*'+command+'\\s*\\${1,2}','g');
 const parenthesized=new RegExp('\\\\[([]\\s*'+command+'\\s*\\\\[)\\]]','g');
 const bare=new RegExp(command,'g');
 const labels={draft_tables:'보고서 표',related_draft_tables:'관련 보고서 표',paragraph_context:'관련 문단',selected_sentence:'선택 문장',source_ids:'근거 위치',source_excerpts:'원문 발췌'};
 const internalNames=new RegExp('`?\\b('+Object.keys(labels).sort((a,b)=>b.length-a.length).map(name=>name.replaceAll('_','\\\\?_')).join('|')+')\\b`?','gi');
 window.CreditReviewDisplayText=value=>String(value??'')
  .replace(inline,(_,name)=>arrows[name])
  .replace(parenthesized,(_,name)=>arrows[name])
  .replace(bare,(_,name)=>arrows[name])
  .replace(internalNames,(_,name)=>labels[name.replaceAll('\\','').toLowerCase()]);
})();

 핵심 결론과 맞아야 한다. 앞 문장이 개선 전망이고 뒤 문장도 다른 지표의 개선 전망이면 다만·반면으로 연결하지 말고 또한·아울러·~도 또는 별도 문장으로 이어간다. 현재 수준이 높다는 유의사항과 향후 개선 전망을 한 문장에 섞어 대비를 흐리지 않는다. 동일 방향의 개선 흐름을 먼저 모아 설명하고, 여전히 남은 위험·제약이 있을 때만 다만을 사용해 별도 문장으로 제시한다. 예: 유동비율 개선 전망과 부채비율 하락 전망은 같은 개선 흐름으로 묶고, 높은 현재 부채비율에 따른 부담은 후미 유의사항으로 분리한다. 접속어만 기계적으로 치환하지 말고 비교 대상·시점과 최종 판단의 관계를 검토한다. 확인된 원인과 추정 가능성을 구분하고, 자료가 없으면 확인이 필요한 내용으로 설명한다.\n\n3. 문장과 특이사항\n문단 길이를 기계적으로 제한하지 않는다. 한 문장은 가급적 화면 3줄 안팎으로 읽히도록 의미 단위로 나누되, 조건과 인과관계 보존을 위해 더 길어질 수 있다. 화면 줄 수를 맞추기 위한 임의 줄바꿈이나 설명 생략은 하지 않는다.\n가~마는 특이사항과 상세 분석의견을 모두 반드시 작성한다. 분석의견은 특이사항과 별개의 필수 본문이며 생략하지 않는다. 가~마의 특이사항은 핵심 3문장, 각 문장은 가급적 1~2줄로 정리한다. 독립적인 근거가 부족하면 3개를 채우려고 추측하지 않는다. 상세 수치·원인·하위 설명은 분석의견에 배치한다. 특이사항 안에는 하위 목록이나 긴 콜론 설명을 넣지 않는다.\n\n4. 출력 구조\nparagraph 하나는 하나의 논점이다. 가~마는 heading에 특이사항 또는 분석의견을 사용해 구분하고, 구역을 유지하는 다음 paragraph는 heading을 빈 문자열로 둔다. 심사보고서는 지정된 목차를 유지하되 불필요한 추가 소제목을 만들지 않는다.\n기본 문단은 같은 수준의 · 표시 또는 일반 문장으로 작성한다. 실제로 한 판단에 속하는 독립된 하위 항목이 있을 때만 · → ☞ 순서로 최대 2단계만 사용한다. 세 번째 단계나 - 기호는 사용하지 않는다. 하위 항목은 별도 paragraph에 작성하며 상위 항목 없이 시작하지 않는다. 단순한 원인·결과 설명을 계층으로 분리하지 않는다. ▷ 등 다른 기호와 장식용 구분선은 쓰지 않는다. 필요한 예외·주의사항은 ※ 참고 문단으로 쓸 수 있으며, ※는 추가 계층이 아니다.\n출처는 source_ids에 연결하고 본문에는 [S1] 같은 출처 기호를 넣지 않는다. 표는 지정된 fixed_tables 양식에 값을 채우고, 의견 문장과 표의 기간·수치가 일치하도록 한다.\n\n5. 응답 전 점검\n각 문단이 같은 논점을 다루는지, 상위·하위 관계가 실제로 성립하는지 확인한다. 설명의 중복, 비교 연도 오류, 근거 없는 인과 단정, 기호 혼용이 있으면 반환 전에 바로잡는다. 데이터가 부족한 부분은 누락된 내용과 판단 한계를 설명하며 이미 업로드된 자료를 포괄적으로 다시 요구하지 않는다.\n\n\n[공통 심사논리: 사실에서 판단으로]\n심사보고서 작성·보완·검토 및 관련 분석 질문에 공통으로 적용한다. 일반 대화나 단순 사실 질문에는 불필요한 심사 형식을 강제하지 않는다. 각 기능의 JSON 구조, 분량, 원문 보존 및 사용자 지정 범위는 유지한다.\n\n상위 제목과 소제목을 먼저 읽고 이 항목에서 독자가 알아야 할 판단 질문을 정한다. 확인된 사실·수치 → 그 사실이 영향을 주는 구체적인 과정이나 조건 → 해당 항목에서 내릴 수 있는 판단으로 연결한다. 사실을 동의어로 되풀이하거나 지표의 정의만 설명하는 것으로 끝내지 않는다. 이 순서를 매번 소제목·목록으로 출력할 필요는 없다.\n\n작성자의 위치는 외부 기업분석 보고서를 쓰는 관찰자가 아니라 본 건 여신신청을 검토하는 심사자다. 기업의 성장·개선 자체에서 설명을 끝내지 말고, 해당 사실이 신청 자금의 필요성·용도, 자금 투입과 회수 시점, 기존 및 추가 채무 부담, 상환재원의 실현 가능성, 채권 회수에 어떤 의미인지 관련성이 있는 지점에서 자연스럽게 드러낸다. 모든 문장에 심사 의견을 덧붙이거나 ‘본 건’, ‘심사 관점에서’, ‘고려할 필요가 있음’을 반복하지 않는다. 항목별 핵심 논점에 심사상 의미를 짧게 연결하고 나머지 사실 설명은 간결하게 유지한다.\n\n신청금액·자금용도·기간·상환방식·담보 등 본 건 조건은 제공된 자료에서 확인된 것만 사용한다. 기존 일반대 증가를 본 건 신청 용도로 간주하거나, 과거 실적을 본 건의 확정 상환재원으로 취급하지 않는다. 신청 조건이 없으면 특정 대출 구조를 가정하지 말고 확인된 기업 상황이 자금 소요·상환재원에 주는 의미까지 설명한다. 판단에 꼭 필요한 신청 조건만 짧게 확인사항으로 남긴다.\n\n예를 들어 재고 증가와 수주 확대가 함께 확인되면 ‘자산 확대에 따라 효율적인 관리가 필요함’이라는 일반론보다 ‘생산자금 투입이 판매대금 회수에 선행하므로 자금 소요와 회수 시점의 대응이 중요함’처럼 여신 검토의 구체적인 논점을 쓴다. 단, 실제 선투입 여부나 계약조건이 확인되지 않았다면 이를 확정 사실로 쓰지 않는다. 출자전환에 따른 부채·자본구조 개선은 긍정적으로 평가하되 현금 유입 여부를 구별하여 실제 상환재원이 늘었는지 별도로 살핀다. 매출·이익 증가는 그 자체로 추가 여신을 감당할 수 있다는 근거가 되지 않는다.\n\n이 관점은 심사 과정의 분석 어조이며 승인·거절·한도·금리·담보 추가 등 처분을 미리 정하는 지시가 아니다. 항목별로 근거가 허용하는 의미와 제약까지만 쓰고, 요청되지 않은 여신 가부나 조건부 승인 결론을 덧붙이지 않는다. 차주에게 경영 개선을 권고하는 문장보다 심사자가 무엇을 평가하는지 드러나는 문장을 사용한다. 기존 분석을 설명하는 팝업·대화에서도 같은 관점을 적용하되 선택 문장의 논점과 요청 범위를 벗어나지 않는다.\n\n‘현금흐름 흑자 전환 → 현금창출력 회복’, ‘이자보상배율 상승 → 이자상환 여력 개선’, ‘영업이익률 상승 → 수익성 개선’만으로는 새로운 분석이 아니다. 원문에서 원인·구성·시점·지속성·규모 비교 등 판단에 도움이 되는 다음 정보를 찾아 연결한다. 비교 지표를 쉽게 풀어 설명할 수는 있지만, 그것만을 새로운 시사점처럼 쓰지 않는다.\n\n항목별 적용 예시(전부 나열하는 필수 목차가 아니라 해당 논점에 맞게 선택할 관점):\n- 주요계정·자산의 질: 채권·재고 증감을 회수기간, 연령·연체, 재고 구성·체류기간, 수주 조건과 연결해 정상적인 사업 확대인지 회수·손실 부담인지 검토한다.\n- 수익성: 이익 변화를 판매량·가격·제품구성·원가·가동률·비경상 요인 중 확인되는 원인과 연결하고 반복 가능한 이익인지 판단한다.\n- 재무안정: 비율 변화를 자본 확충의 실제 성격, 부채 만기, 자산의 현금화 가능성, 우발부담과 연결해 충격을 흡수할 여유를 검토한다. 장부상 재분류와 실제 현금 유입은 구별한다.\n- 현금창출력·상환재원: 현금흐름을 실제 상환에 사용 가능한 금액과 지급 시점에 연결한다. 투자·운전자금 투입, 만기 원금, 이자 지급, 확보된 조달 조건을 자료가 있는 범위에서 대조한다. 영업이익 또는 EBITDA가 곧 지급 가능한 현금이라고 쓰지 않는다. ‘영업활동후 현금흐름’ 등 지표별 정의와 이미 차감된 항목을 확인하여 투자·이자 등을 이중 차감하지 않는다.\n- 주요매출처·사업성: 매출 비중·수주를 거래 지속성, 계약조건·취소 가능성, 대금 회수, 고객 대체 가능성, 생산자금 선투입과 연결한다. 수주가 곧 현금 유입이라고 단정하지 않는다.\n- 업체개요: 연혁·주주·사업구조가 사업 기반, 의사결정·지원 가능성, 특정 인물·관계사 의존도에 주는 영향을 확인된 근거 안에서 설명한다.\n- 채권보전: 담보 존재만 언급하지 말고 본건 제공 여부, 평가 기준, 선순위·설정액·처분 제약과 실제 회수재원을 구별한다.\n- 종합의견·심사보고서: 각 항목의 결론을 복사하여 나열하지 말고 상환재원과 자금 소요가 어떻게 맞물리는지, 중요한 강점·위험이 무엇인지 연결한다.\n\n원인 확인과 미래 지속성은 별개다. 원재료 가격 하락이나 비경상 손익 부재만으로 이익의 지속성을 단정하지 않는다. 향후 계약단가·원가 조건·반복 매출 등의 근거가 있어야 지속 가능성   const resultCSS='.result-only-toggle{display:inline-flex!important;align-items:center;justify-content:center;box-sizing:border-box;width:26px!important;height:26px!important;min-width:26px!important;padding:2px!important;margin-right:5px;border:1px solid #dce4d8!important;border-radius:5px;background:#fff!important;color:#6d826a;cursor:pointer;transition:background .12s,box-shadow .12s,transform .12s}.result-only-toggle svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.result-only-toggle:hover{background:#f1f5ed!important}.result-only-toggle[aria-pressed=true]{background:#dce8d5!important;border-color:#8fa585!important;color:#405d38;box-shadow:inset 0 2px 4px #38502a35!important;transform:translateY(1px)}.result-only-toggle:focus-visible{outline:2px solid #8fa585;outline-offset:2px}.results-only .evidence-open,.results-only .sentence-analysis-open,.results-only .review-gap-button,.results-only #chatPanel,.results-only #chatLaunchRow,.results-only #chatToggle,.results-only #drawer,.results-only #coverage,.results-only #filePopover,.results-only .repair-chat,.results-only .repair-divider,.results-only .repair-tip,.results-only .repair-version-control,.results-only .regenerate-control,.results-only .inline-revision,.results-only .revision-nav{display:none!important}.results-only .repair-layout{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr)!important}.results-only #opinion p,.results-only #repairBody p{cursor:text!important}.results-only #opinion p.selected,.results-only #repairBody p.selected{background:transparent!important;box-shadow:none!important;outline:0!important}.results-only #opinion p:hover,.results-only #repairBody p:hover,.results-only #opinion .evidence-sentence:hover,.results-only #repairBody .evidence-sentence:hover,.results-only #opinion p:focus,.results-only #repairBody p:focus{background:transparent!important;box-shadow:none!important;outline:0!important;cursor:text!important}.results-only .evidence-sentence{cursor:text!important;background:transparent!important;text-decoration:none!important;box-shadow:none!important}.results-only #opinion p,.results-only #repairBody p{ text-decoration:none!important}.results-only .evidence-sentence:hover,.results-only .evidence-sentence:hover span{background:transparent!important;text-decoration:none!important;box-shadow:none!important}.results-only .sentence-tools,.results-only .repair-sentence-tools{display:none!important}';
  const isResultsOnly=()=>appWindow.classList.contains('results-only');
  function syncResultMode(){
    const active=isResultsOnly(),label=active?'분석모드로 돌아가기':'결과만 보기';
    for(const b of resultButtons){if(!b.isConnected){resultButtons.delete(b);continue;}b.title=label;b.setAttribute('aria-label',label);b.setAttribute('aria-pressed',String(active));if(b.ownerDocument!==document)b.ownerDocument.documentElement.classList.toggle('results-only',active);}
  }
  function toggleResultsOnly(){appWindow.classList.toggle('results-only');syncResultMode();}
  function attachResultsButton(doc,before){
    syncFontSize();
    if(!before||doc.getElementById('resultOnlyToggle'))return;
    const style=doc.createElement('style');style.textContent=resultCSS;doc.head.append(style);
    const button=doc.createElement('button');button.id='resultOnlyToggle';button.type='button';button.className='result-only-toggle';button.innerHTML='<svg viewBox="0 0 20 20" aria-hidden="true"><rect x=".75" y="1.5" width="18.5" height="17" rx="1.8" fill="#a8b7a2" stroke="none"/><rect x="2" y="2.75" width="16" height="14.5" rx=".6" fill="none" stroke="white" stroke-width="1.2"/><path d="M6 5h5.5L14 7.5V15H6Z" fill="white" stroke="none"/><path d="M11.5 5v2.5H14M8 10h4M8 12h4" stroke="currentColor" stroke-width="1"/></svg>';
    button.onclick=e=>{e.preventDefault();e.stopPropagation();toggleResultsOnly();};before.before(button);resultButtons.add(button);syncResultMode();
  }
  attachResultsButton(document,document.querySelector('.ide-run-group'));
  window.addEventListener('click',e=>{if(isResultsOnly()&&e.target.closest('#opinion p,#opinion .aggregate-title'))e.stopImmediatePropagation();},true);
  const historyButton=$('fullSourceButton');
  const style=document.createElement('style');
  style.textContent='.app.expanded .top .tools{gap:8px}.app.expanded .top .tools>.icon{width:32px;height:32px;flex-shrink:0}.app.expanded .ide-run-group{gap:3px;margin-right:10px}.app.expanded .ide-run{width:29px!important;height:29px!important}.recent-chat-row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #e3e9df;background:transparent;padding:11px 2px;color:inherit;cursor:pointer}.recent-chat-row small{display:block;font-size:10px;color:#819077;margin-bottom:5px}.recent-chat-row span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.5}.recent-chat-row:hover{background:#f0f5ed}';
  document.head.append(style);
  const dialogStyle=document.createElement('style');
  dialogStyle.textContent='.review-dialog.compact-dialog{box-sizing:border-box;position:fixed;inset:auto;margin:0;width:var(--dialog-width)!important;max-width:var(--dialog-width)!important;max-height:var(--dialog-height)!important;left:var(--dialog-left);top:var(--dialog-top);padding:14px;font-size:12px}.compact-dialog h2{font-size:14px}.compact-dialog header button{font-size:18px;padding:3px 7px}.compact-dialog button{font-size:12px;padding:5px 9px}.compact-dialog .generation-list{margin-top:10px}.compact-dialog .generation-row{padding:7px 0;font-size:12px;gap:8px}.compact-dialog .generation-row button{min-width:48px}.compact-dialog .generation-child{padding-left:18px}.compact-dialog .system-prompt-editor{box-sizing:border-box;min-height:130px;height:32vh;font-size:12px;padding:8px}.compact-dialog>p{font-size:11px}';
  document.head.append(dialogStyle);
  function fitDialogs(){
    const r=appWindow.getBoundingClientRect(),compact=!appWindow.classList.contains('expanded');
    document.querySelectorAll('.review-dialog').forEach(d=>{
      d.classList.toggle('compact-dialog',compact);
      if(compact){d.style.setProperty('--dialog-width',Math.max(0,r.width-24)+'px');d.style.setProperty('--dialog-height',Math.max(0,r.height-64)+'px');d.style.setProperty('--dialog-left',r.left+12+'px');d.style.setProperty('--dialog-top',r.top+42+'px');}
    });
  }
  new MutationObserver(fitDialogs).observe(document.body,{childList:true,subtree:true});
  new MutationObserver(fitDialogs).observe(appWindow,{attributes:true,attributeFilter:['class']});
  window.addEventListener('resize',fitDialogs);
  historyButton.title='최근 대화 이력';historyButton.setAttribute('aria-label','최근 대화 이력');
  syncFullSourceButton=()=>historyButton.setAttribute('aria-expanded',String(!$('drawer').hidden&&$('drawerTitle').textContent==='최근 대화 이력'));
  function dismiss(){closePanels();syncFullSourceButton();}
  function openHistory(){
    const wasOpen=!$('drawer').hidden&&$('drawerTitle').textContent==='최근 대화 이력';
    dismiss();if(wasOpen)return;
    $('drawerTitle').textContent='최근 대화 이력';$('drawerBody').replaceChildren();$('drawer').hidden=false;
    const rows=[];
    for(const [key,messages] of chatThreads){
      const [company,view,mode]=key.split(':');if(Number(company)!==currentCompany)continue;
      messages.forEach((m,index)=>{if(m.role==='user')rows.push({m,index,view:Number(view),mode:mode==='revise'?'revise':'chat'});});
    }
    rows.sort((a,b)=>(Date.parse(b.m.createdAt)||0)-(Date.parse(a.m.createdAt)||0)||b.index-a.index);
    if(!rows.length){const empty=document.createElement('p');empty.textContent='아직 대화 이력이 없습니다.';$('drawerBody').append(empty);}
    for(const row of rows.slice(0,50)){
      const b=document.createElement('button');b.className='recent-chat-row';
      const label=document.createElement('small');label.textContent=reviewLabels[row.view]+' · '+(row.mode==='revise'?'의견보완':'대화');
      const text=document.createElement('span');text.textContent=row.m.text;b.append(label,text);
      b.onclick=()=>{if($('prompt').disabled)return;dismiss();switchReview(row.view);CreditReview.setMode(row.mode);setChatOpen(true);const frame=operatingFrames.get(currentCompany);frame?.contentDocument?.querySelector('.repair-layout')?.classList.remove('chat-hidden');};
      $('drawerBody').append(b);
    }
    syncFullSourceButton();
  }
  historyButton.onclick=e=>{e.stopPropagation();openHistory();};
  document.addEventListener('pointerdown',e=>{
    if(e.target.closest('.top .tools,#drawer,#filePopover,#coverage,#menu,dialog'))return;
    dismiss();
  },true);
  new MutationObserver(syncFullSourceButton).observe($('drawer'),{attributes:true,attributeFilter:['hidden']});
  window.CreditReviewToolbar={dismiss,openHistory,isResultsOnly,attachResultsButton};
  for(const frame of operatingFrames.values()){const doc=frame.contentDocument;if(doc)attachResultsButton(doc,doc.querySelector('.ide-run-group'));}
})();

</script><script>
/* Retain the original titlebar fullscreen/restore behavior. */
(() => {
  'use strict';
  const app=document.getElementById('appWindow');
  document.getElementById('titlebar').addEventListener('pointerdown',e=>e.stopImmediatePropagation(),true);
  window.CreditReview.ready.then(()=>{
    app.classList.remove('minimized','expanded');
    reflectFullscreen();
  });
})();

</script></body></html>
