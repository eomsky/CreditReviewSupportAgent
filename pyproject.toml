[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-review-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "pandas>=2.2,<3", "numpy>=1.26,<3", "httpx>=0.27,<1", "streamlit>=1.40,<2", "pymupdf>=1.25,<2", "scikit-learn==1.8.0", "joblib>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
embedding = ["sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
credit_review = ["factors.json", "prompts/*.md"]
"credit_review.vendor.spt017" = ["*.joblib", "provenance.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
